# CONFIGURACION SERVIDOR
server.port=8080

# Carga .env en local (opcional: si no existe no falla; en Docker las vars vienen del entorno)
spring.config.import=optional:file:.env[.properties]

# BASE DE DATOS
spring.datasource.url=jdbc:mysql://localhost:3306/lockstrm_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE
# En producción usar 'validate' con Flyway/Liquibase. 'update' solo para desarrollo local.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SERIALIZACIÓN JSON
# Serializa LocalDateTime/LocalDate como ISO-8601 (e.g. "2025-03-15T10:30:00") en lugar de array numérico.
spring.jackson.serialization.write-dates-as-timestamps=false

# ARCHIVOS
# max-request-size incluye overhead multipart (boundaries, headers por parte),
# por eso dejamos ~10 MB de margen sobre max-file-size para que un archivo de
# exactamente 200 MB no sea rechazado por el wrapper multipart.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# JWT (clave Base64 minimo 256 bits; requerido via JWT_SECRET env var)
jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# ALMACENAMIENTO LOCAL DE VÍDEOS
# En desarrollo usa una ruta local; en VPS apunta al directorio montado (ej. /var/lockstrm/videos)
lockstrm.upload.dir=${UPLOAD_DIR:./uploads/videos}

# CORS
cors.origin=${CORS_ORIGIN:http://localhost:4200}

# ACTUATOR / MÉTRICAS
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# RATE LIMITING (peticiones por minuto por IP sobre /api/auth/*)
lockstrm.ratelimit.auth.capacity=10
lockstrm.ratelimit.auth.refill-per-minute=10
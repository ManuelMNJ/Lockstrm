# CONFIGURACION SERVIDOR
server.port=8080

# Carga .env en local (opcional: si no existe no falla; en Docker las vars vienen del entorno)
spring.config.import=optional:file:.env[.properties]

# BASE DE DATOS
spring.datasource.url=jdbc:mysql://localhost:3306/lockstrm_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# FLYWAY
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#JSON
# Serializa LocalDateTime/LocalDate como ISO-8601 (e.g. "2025-03-15T10:30:00") en lugar de array numérico.
spring.jackson.serialization.write-dates-as-timestamps=false

# ARCHIVOS
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=28800000

# ALMACENAMIENTO LOCAL DE ViDEOS
# En desarrollo usa una ruta local, en VPS apunta al directorio montado
lockstrm.upload.dir=${UPLOAD_DIR:./uploads/videos}

# ALMACENAMIENTO DE MINIATURAS
lockstrm.upload.thumbnails.dir=${THUMBNAILS_DIR:./uploads/thumbnails}

# ALMACENAMIENTO DE AVATARES
lockstrm.upload.avatars.dir=${AVATARS_DIR:./uploads/avatars}

# ALMACENAMIENTO DE IMÁGENES DE GRUPO
lockstrm.upload.grupos.dir=${GRUPOS_IMG_DIR:./uploads/grupos}

# CORS
cors.origin=${CORS_ORIGIN:http://localhost:4200}

# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# RATE LIMITING (peticiones por minuto por IP sobre /api/auth/* y endpoints sensibles)
lockstrm.ratelimit.auth.capacity=10
lockstrm.ratelimit.auth.refill-per-minute=10
# CONFIGURACION SERVIDOR
server.port=8080

# BASE DE DATOS
spring.datasource.url=jdbc:mysql://localhost:3306/lockstrm_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HIBERNATE
# En producción usar 'validate' con Flyway/Liquibase. 'update' solo para desarrollo local.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ARCHIVOS
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# JWT (clave Base64 minimo 256 bits; en produccion sobreescribir con JWT_SECRET env var)
jwt.secret=${JWT_SECRET:bG9ja3N0cm1fc2VjcmV0X2Rldl9rZXlfY2hhbmdlX2luX3Byb2Q=}
jwt.expiration=86400000


<div class="ajustes-page">

  <!-- ================================================================
  APARIENCIA
  ================================================================ -->
  <section class="settings-section" aria-labelledby="apariencia-heading">
    <div class="section-header">
      <div class="section-icon section-icon--green">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22"/>
        </svg>
      </div>
      <div>
        <h2 class="section-title" id="apariencia-heading">Apariencia</h2>
        <p class="section-sub">Personaliza el aspecto visual de la interfaz.</p>
      </div>
    </div>

    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Modo oscuro</span>
        <span class="toggle-desc">Interfaz con fondo oscuro, recomendada para uso prolongado.</span>
      </div>
      <button class="toggle-switch"
        [class.toggle-switch--on]="modoOscuro"
        (click)="toggleModo()"
        role="switch"
        [attr.aria-checked]="modoOscuro"
        aria-label="Activar modo oscuro">
        <span class="toggle-thumb"></span>
      </button>
    </div>
  </section>

</div>

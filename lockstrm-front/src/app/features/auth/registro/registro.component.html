<div class="registro-root">
  <h2> Registro en Lockstrm</h2>

  <div class="registro-card">

    <div>
      <input type="text" placeholder="Usuario" [(ngModel)]="usuario.username" class="registro-input">
    </div>

    <div>
      <input type="email" placeholder="Email" [(ngModel)]="usuario.email" class="registro-input">
    </div>

    <div>
      <input type="password" placeholder="Contraseña" [(ngModel)]="usuario.password" class="registro-input">
    </div>

    <button (click)="registrar()" class="registro-button">
      Registrarse
    </button>

  </div>

  <p class="registro-mensaje">{{ mensaje }}</p>
</div>

<div>
  <h2>Gestor de Videos</h2>

  <div style="border: 1px solid #ccc; padding: 20px; margin-bottom: 20px;">
    <h3>Subir nuevo video</h3>
    
    <div style="margin-bottom: 10px;">
      <label>Titulo: </label>
      <input type="text" [(ngModel)]="tituloVideo" placeholder="Escribe el titulo">
    </div>

    <div style="margin-bottom: 10px;">
      <label>Archivo MP4: </label>
      <input type="file" accept="video/*" (change)="seleccionarArchivo($event)">
    </div>

    <button (click)="subir()" [disabled]="subiendo">
      {{ subiendo ? 'Subiendo...' : 'Subir Video' }}
    </button>

    <p *ngIf="mensaje" style="color: blue; font-weight: bold;">{{ mensaje }}</p>
  </div>

  <hr>

  <h3>Tus Videos</h3>
  
  <div style="display: flex; flex-direction: column; gap: 20px;">
    <div *ngFor="let v of videos" style="border: 1px solid #eee; padding: 10px;">
      <h4>{{ v.titulo }}</h4>
      
      <video width="100%" style="max-width: 500px;" controls preload="metadata">
        <source [src]="v.urlCloudSecure" type="video/mp4">
        Tu navegador no soporta videos.
      </video>
    </div>
    
    <p *ngIf="videos.length === 0">No hay videos todavia.</p>
  </div>
</div>

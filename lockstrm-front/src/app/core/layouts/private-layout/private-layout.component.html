<!-- ==========================================================================
  Lockstrm — Private Layout
  Nota: El navbar global (brand + acciones de cuenta) es responsabilidad de
        AppShellComponent. Este layout gestiona únicamente el área privada:
        CSS Grid de dos columnas → <aside> (sidebar) | .main-wrapper.
  ========================================================================== -->
<div class="app-shell">

  <!-- ================================================================
    SIDEBAR
    ================================================================ -->
  <aside class="sidebar" role="complementary" aria-label="Navegación principal">

    <!-- ── Primary navigation ── -->
    <nav class="sidebar-nav" aria-label="Secciones">

      <!-- Inicio (volver a la homepage pública) -->
      <a routerLink="/"
         class="nav-item"
         title="Ir al inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Inicio
      </a>

      <div class="nav-divider" aria-hidden="true"></div>

      <!-- Dashboard -->
      <a routerLink="/dashboard"
         routerLinkActive="active"
         class="nav-item"
         title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <!-- ── Sección: Mi Espacio (Propietario) ── -->
      <span class="nav-section-label">Mi Espacio</span>

      <a routerLink="/mi-espacio/videos"
         routerLinkActive="active"
         class="nav-item"
         title="Mis Vídeos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        Mis Vídeos
      </a>

      <a routerLink="/mi-espacio/grupos"
         routerLinkActive="active"
         class="nav-item"
         title="Mis Grupos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Mis Grupos
      </a>

      <a routerLink="/mi-espacio/analiticas"
         routerLinkActive="active"
         class="nav-item"
         title="Analíticas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <polyline points="18 20 18 10"/>
          <polyline points="12 20 12 4"/>
          <polyline points="6 20 6 14"/>
        </svg>
        Analíticas
      </a>

      <!-- ── Sección: Compartido conmigo (Espectador) ── -->
      <span class="nav-section-label">Compartido conmigo</span>

      <a routerLink="/compartido"
         routerLinkActive="active"
         class="nav-item"
         title="Vídeos Disponibles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        Vídeos Disponibles
      </a>

      <!-- ── Sección: General ── -->
      <span class="nav-section-label">General</span>

      <a routerLink="/perfil"
         routerLinkActive="active"
         class="nav-item"
         title="Mi Perfil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Mi Perfil
      </a>

      <a routerLink="/ajustes"
         routerLinkActive="active"
         class="nav-item"
         title="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                   a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                   A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06
                   a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15
                   a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                   A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06
                   a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68
                   a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                   a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06
                   a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9
                   a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                   a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Ajustes
      </a>

    </nav>

    <!-- ── Sidebar footer: usuario autenticado ── -->
    <!-- guestBlock eliminado: authGuard garantiza que currentUser() != null -->
    <div class="sidebar-footer">
      @if (currentUser(); as user) {
        <div class="user-profile">
          <div class="user-avatar" aria-hidden="true">
            {{ user.nombre.charAt(0).toUpperCase() }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ user.nombre }} {{ user.apellidos }}</span>
            <span class="user-role">@{{ user.username }}#{{ user.tag }}</span>
          </div>
          <button class="btn-logout"
                  (click)="cerrarSesion()"
                  title="Cerrar sesión"
                  aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      }
    </div>
  </aside>

  <!-- ================================================================
    MAIN AREA
    ================================================================ -->
  <div class="main-wrapper">

    <!-- ── Page header ── -->
    <header class="main-header">
      <h1 class="header-title">{{ pageTitle }}</h1>
    </header>

    <!-- ── Routed content ── -->
    <main class="main-content" role="main">
      <router-outlet/>
    </main>

  </div>

</div>

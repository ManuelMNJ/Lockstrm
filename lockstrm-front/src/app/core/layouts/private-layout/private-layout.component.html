<!-- ==========================================================================
  Lockstrm — Private Layout (App Shell)
  Estructura: CSS Grid de dos columnas → <aside> (sidebar) | .main-wrapper
  Todas las rutas privadas se renderizan en el <router-outlet> de .main-content.
  ========================================================================== -->
<div class="app-shell">

  <!-- ================================================================
    SIDEBAR
    ================================================================ -->
  <aside class="sidebar" role="complementary" aria-label="Navegación principal">

    <!-- ── Brand ── -->
    <div class="sidebar-brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <span class="brand-name">Lockstrm</span>
    </div>

    <!-- ── Primary navigation ── -->
    <nav class="sidebar-nav" aria-label="Secciones">

      <a routerLink="/dashboard"
         routerLinkActive="active"
         class="nav-item"
         title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        Dashboard
      </a>

      <a routerLink="/videos"
         routerLinkActive="active"
         class="nav-item"
         title="Mis Vídeos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <polygon points="23 7 16 12 23 17 23 7"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        Mis Vídeos
      </a>

      <a routerLink="/grupos"
         routerLinkActive="active"
         class="nav-item"
         title="Mis Grupos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Mis Grupos
      </a>

      <a routerLink="/ajustes"
         routerLinkActive="active"
         class="nav-item"
         title="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06
                   a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
                   A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06
                   a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15
                   a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
                   A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06
                   a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68
                   a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
                   a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06
                   a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9
                   a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
                   a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Ajustes
      </a>

    </nav>

    <!-- ── Sidebar footer: user session ── -->
    <div class="sidebar-footer">

      <!-- Authenticated user -->
      <ng-container *ngIf="usuarioLogueado; else guestBlock">
        <div class="user-profile">
          <div class="user-avatar" aria-hidden="true">
            {{ usuarioLogueado.username?.charAt(0)?.toUpperCase() }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ usuarioLogueado.username }}</span>
            <span class="user-role">Miembro</span>
          </div>
          <button class="btn-logout"
                  (click)="cerrarSesion()"
                  title="Cerrar sesión"
                  aria-label="Cerrar sesión">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </ng-container>

      <!-- Guest (not authenticated) -->
      <ng-template #guestBlock>
        <div class="guest-links">
          <a routerLink="/login" routerLinkActive="active" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Iniciar sesión
          </a>
          <a routerLink="/registro" routerLinkActive="active" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            Registrarse
          </a>
        </div>
      </ng-template>

    </div>
  </aside>

  <!-- ================================================================
    MAIN AREA
    ================================================================ -->
  <div class="main-wrapper">

    <!-- ── Page header ── -->
    <header class="main-header">
      <h1 class="header-title">{{ pageTitle }}</h1>
    </header>

    <!-- ── Routed content ── -->
    <main class="main-content" role="main">
      <router-outlet/>
    </main>

  </div>

</div>

<!-- ==========================================================================
  Lockstrm — App Shell (Root Layout)
  Navbar global reactivo al estado de autenticación vía Angular Signals.
    • Usuario anónimo → enlaces públicos + botones Login / Registro
    • Usuario autenticado → "Ir al Panel" + menú de perfil con logout
  ========================================================================== -->
<div class="shell-root">

  <!-- ================================================================
    GLOBAL NAVBAR
    ================================================================ -->
  <header class="global-nav" role="banner">

    <!-- ── Brand: ancla siempre a / ── -->
    <a routerLink="/" class="global-brand" aria-label="Lockstrm — ir al inicio">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <span class="brand-name">Lockstrm</span>
    </a>

    <!-- ── Acciones: condicional al estado de autenticación ── -->
    <nav class="global-nav-actions" aria-label="Acciones de cuenta">

      <!-- ── USUARIO AUTENTICADO ─────────────────────────────────────── -->
      @if (authService.isAuthenticated()) {

        <!-- Botón destacado para entrar al panel -->
        <a routerLink="/dashboard"
           routerLinkActive="btn-panel--active"
           class="btn-panel"
           aria-label="Ir al panel de control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          Ir al Panel
        </a>

        <!-- Menú de perfil -->
        <div class="profile-wrapper">

          <!-- Trigger -->
          <button class="profile-trigger"
                  (click)="toggleMenu($event)"
                  [attr.aria-expanded]="menuOpen()"
                  aria-haspopup="true"
                  aria-label="Menú de perfil">
            <div class="trigger-avatar" aria-hidden="true">
              {{ authService.currentUser()?.username?.charAt(0)?.toUpperCase() }}
            </div>
            <span class="trigger-name">{{ authService.currentUser()?.username }}</span>
            <!-- Chevron -->
            <svg class="trigger-chevron"
                 [class.trigger-chevron--open]="menuOpen()"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <!-- Dropdown panel -->
          @if (menuOpen()) {

            <!-- Backdrop transparente: cierra el menú al hacer clic fuera -->
            <div class="menu-backdrop"
                 (click)="closeMenu()"
                 aria-hidden="true">
            </div>

            <div class="profile-dropdown" role="menu" aria-label="Opciones de perfil">

              <!-- Cabecera del dropdown: info del usuario -->
              <div class="dropdown-profile-header">
                <div class="dropdown-avatar" aria-hidden="true">
                  {{ authService.currentUser()?.username?.charAt(0)?.toUpperCase() }}
                </div>
                <div class="dropdown-user-info">
                  <span class="dropdown-username">
                    {{ authService.currentUser()?.username }}
                  </span>
                  <span class="dropdown-role">Miembro</span>
                </div>
              </div>

              <div class="dropdown-divider" role="separator"></div>

              <!-- Opción: Cerrar sesión -->
              <button class="dropdown-item dropdown-item--danger"
                      (click)="cerrarSesion()"
                      role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Cerrar sesión
              </button>

            </div>
          }

        </div>
      }

      <!-- ── USUARIO ANÓNIMO ──────────────────────────────────────────── -->
      @else {
        <a routerLink="/login"
           routerLinkActive="nav-link--active"
           class="nav-link">
          Iniciar sesión
        </a>
        <a routerLink="/registro" class="btn-primary">
          Solicitar acceso
        </a>
      }

    </nav>
  </header>

  <!-- ================================================================
    SHELL BODY — PublicLayout o PrivateLayout se montan aquí
    ================================================================ -->
  <div class="shell-body">
    <router-outlet/>
  </div>

</div>

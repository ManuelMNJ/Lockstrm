<nav class="navbar-root">

  <div class="navbar-brand">
    Lockstrm
  </div>

  <div class="navbar-links">

    @if (currentUser()) {
      <a routerLink="/perfil" class="navbar-avatar" title="Mi perfil" aria-label="Ir a mi perfil">
        @if (getAvatarSrc()) {
          <img [src]="getAvatarSrc()!" alt="Avatar" class="navbar-avatar-img">
        } @else {
          <span class="navbar-avatar-initials" aria-hidden="true">{{ getInitials() }}</span>
        }
      </a>
      <button (click)="cerrarSesion()" class="navbar-logout">Cerrar sesión</button>
    }

    @if (!currentUser()) {
      <a routerLink="/" class="navbar-link">Inicio</a>
      <a routerLink="/login" class="navbar-link">Entrar</a>
      <a routerLink="/registro" class="navbar-register">Registrarse</a>
    }

  </div>
</nav>

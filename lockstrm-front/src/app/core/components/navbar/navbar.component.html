<nav class="navbar-root">

  <div class="navbar-brand">
    Lockstrm
  </div>

  <div class="navbar-links">

    <a routerLink="/home" class="navbar-link">Inicio</a>

    @if (currentUser()) {
      <a routerLink="/grupos" class="navbar-link">Grupos</a>
      <a routerLink="/videos" class="navbar-link">Mis Vídeos</a>
      <span class="navbar-welcome">Hola, {{ currentUser()!.nombre }} {{ currentUser()!.apellidos }}</span>

      <!-- Avatar / iniciales con enlace al perfil -->
      <a routerLink="/perfil" class="navbar-avatar" title="Mi perfil" aria-label="Ir a mi perfil">
        @if (getAvatarSrc()) {
          <img [src]="getAvatarSrc()!" alt="Avatar" class="navbar-avatar-img">
        } @else {
          <span class="navbar-avatar-initials" aria-hidden="true">{{ getInitials() }}</span>
        }
      </a>

      <button (click)="cerrarSesion()" class="navbar-logout">Salir</button>
    }

    @if (!currentUser()) {
      <a routerLink="/login" class="navbar-link">Entrar</a>
      <a routerLink="/registro" class="navbar-register">Registrarse</a>
    }

  </div>
</nav>

@if (config$ | async; as cfg) {
<div class="cm-backdrop"
     (click)="cancel()"
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="cm-title"
     aria-describedby="cm-desc">

  <div class="cm-box" (click)="$event.stopPropagation()">

    <div class="cm-icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0
                 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9"  x2="12"    y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>

    <h3 class="cm-title" id="cm-title">{{ cfg.title }}</h3>
    <p  class="cm-desc"  id="cm-desc">{{ cfg.message }}</p>

    <div class="cm-actions">
      <button class="cm-btn cm-btn--cancel"  (click)="cancel()">{{ cfg.cancelLabel }}</button>
      <button class="cm-btn cm-btn--confirm" (click)="confirm()" autofocus>{{ cfg.confirmLabel }}</button>
    </div>

  </div>
</div>
}

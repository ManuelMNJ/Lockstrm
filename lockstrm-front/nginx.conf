server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion gzip para reducir el peso de los assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Proxy inverso hacia el backend Spring Boot
    # El frontend llama a /api/... y Nginx lo redirige internamente al backend
    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para uploads de video grandes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 250m;
    }

    # SPA fallback: cualquier ruta que no sea un archivo existente
    # se redirige al index.html para que Angular Router la gestione
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresiva para assets con hash en el nombre (generados por Angular)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sin cache para el index.html (siempre debe ser el mas reciente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

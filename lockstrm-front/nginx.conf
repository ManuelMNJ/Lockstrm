server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion gzip para reducir el peso de los assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # SPA fallback: cualquier ruta que no sea un archivo existente
    # se redirige al index.html para que Angular Router la gestione
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresiva para assets con hash en el nombre (generados por Angular)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sin cache para el index.html (siempre debe ser el mas reciente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

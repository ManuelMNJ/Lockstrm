services:

  # BASE DE DATOS
  db:
    image: mysql:8.0
    container_name: lockstrm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lockstrm_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # BACKEND (Spring Boot)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lockstrm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/lockstrm_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DDL_AUTO: validate
      UPLOAD_DIR: /var/lockstrm/videos
      THUMBNAILS_DIR: /var/lockstrm/thumbnails
      AVATARS_DIR: /var/lockstrm/avatars
      GRUPOS_IMG_DIR: /var/lockstrm/grupos
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - ./uploads/videos:/var/lockstrm/videos
      - ./uploads/thumbnails:/var/lockstrm/thumbnails
      - ./uploads/avatars:/var/lockstrm/avatars
      - ./uploads/grupos:/var/lockstrm/grupos
    ports:
      - "8080:8080"

  # FRONTEND (Angular + Nginx)
  frontend:
    build:
      context: ./lockstrm-front
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
    container_name: lockstrm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

# VOLUMENES
volumes:
  mysql_data:
    driver: local

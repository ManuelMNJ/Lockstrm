services:

  # ─────────────────────────────────────────
  # BASE DE DATOS
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: lockstrm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lockstrm_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────
  # BACKEND (Spring Boot)
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lockstrm_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Sobreescribimos application.properties via variables de entorno
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/lockstrm_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:http://localhost:4200}
    ports:
      - "8080:8080"

  # ─────────────────────────────────────────
  # FRONTEND (Angular + Nginx)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./lockstrm-front
      dockerfile: Dockerfile
    container_name: lockstrm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

# ─────────────────────────────────────────
# VOLUMENES
# ─────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
